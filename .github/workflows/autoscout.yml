# Scheduled self-iteration for autoscout.
#
# Each run harvests the newest arXiv papers on the agenda, learns from them,
# and (once enough human labels exist) proposes, tests and gates changes to the
# agent's own configuration. The resulting state is NOT pushed to main: it is
# opened as a pull request. Merging that PR is the human checkpoint that stops
# an automated loop from compounding a mistake. An unmerged PR is simply
# refreshed by the next run, which starts again from main's state.
#
# Optional: add an ANTHROPIC_API_KEY repository secret to enable the Claude
# proposer. Without it the agent runs on mutation and literature proposers.
name: autoscout

on:
  schedule:
    - cron: "17 6 * * 1"  # Mondays 06:17 UTC
  workflow_dispatch:
    inputs:
      cycles:
        description: Cycles to run
        default: "1"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: autoscout
  cancel-in-progress: false

jobs:
  iterate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: pip install -e ".[dev,llm]"

      - name: Test
        run: python -m pytest -q

      - name: Iterate
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python -m autoscout.cli --state autoscout_state run --live \
            --cycles "${{ github.event.inputs.cycles || '1' }}"
          python -m autoscout.cli --state autoscout_state queue --n 25 \
            --out autoscout_state/label_queue.jsonl
          {
            echo "## autoscout"
            echo
            tail -n 1 autoscout_state/cycles.jsonl | python -c \
              "import json,sys; c=json.load(sys.stdin); print(f\"cycle {c['cycle']}: {c['new_papers']} new papers, {c['flagged']} flagged, {c['mined_terms']} mined terms. Decision: {c['decision']}\")"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Open or refresh the iteration PR
        uses: peter-evans/create-pull-request@v6
        with:
          branch: autoscout/iteration
          add-paths: autoscout_state/**
          commit-message: "autoscout: scheduled iteration"
          title: "autoscout: scheduled iteration"
          body: |
            Automated autoscout cycle. Review before merging:

            - `autoscout_state/digests/` -- this cycle's reading list of new papers
            - `autoscout_state/REPORT.md` -- the trajectory; check that `sealed` moves with `tune`
            - `autoscout_state/champion.json` -- any promoted configuration change
            - `autoscout_state/ideas.md` -- changes that need code, for a human
            - `autoscout_state/label_queue.jsonl` -- set `label` on these and run
              `python -m autoscout.cli --state autoscout_state label --import autoscout_state/label_queue.jsonl`;
              self-modification in live mode starts once 40 real papers are labelled.
          delete-branch: true
