# Runs queued research jobs on GitHub-hosted runners (free for public repositories).
# A job is a shell script in research/compute/jobs/. Pushing a new or changed script
# to this branch runs it; its log and any files it writes to $OUT are committed back
# under research/compute/results/<job-name>/.
name: hfm-compute
on:
  push:
    branches: [claude/human-frontier-initiatives-4n1eh3]
    paths: ['research/compute/jobs/*.sh']
permissions:
  contents: write
  models: read      # lets jobs call GitHub Models' free, rate-limited inference API
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      jobs: ${{ steps.find.outputs.jobs }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - id: find
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then base="$BEFORE"; else base="HEAD~1"; fi
          files=$(git diff --no-renames --name-only --diff-filter=AM "$base" HEAD -- 'research/compute/jobs/*.sh' | xargs -r -n1 basename | sed 's/\.sh$//')
          echo "jobs=$(printf '%s\n' $files | jq -R . | jq -cs 'map(select(length>0))')" >> "$GITHUB_OUTPUT"
  run:
    needs: plan
    if: needs.plan.outputs.jobs != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        job: ${{ fromJson(needs.plan.outputs.jobs) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Run job
        env:
          JOB: ${{ matrix.job }}
          GH_MODELS_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          export OUT="$GITHUB_WORKSPACE/research/compute/results/$JOB"
          export DATA="$RUNNER_TEMP/data"
          mkdir -p "$OUT" "$DATA"
          { echo "job: $JOB"; echo "started: $(date -u +%FT%TZ)"; echo "cores: $(nproc), memory: $(free -g | awk '/Mem/{print $2}') GB"; } > "$OUT/run.log"
          set +e
          bash "research/compute/jobs/$JOB.sh" >> "$OUT/run.log" 2>&1
          code=$?
          set -e
          echo "finished: $(date -u +%FT%TZ), exit code $code" >> "$OUT/run.log"
          tail -c 20000 "$OUT/run.log"
      - name: Commit results
        env:
          JOB: ${{ matrix.job }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "research/compute/results/$JOB"
          git commit -m "Compute results: $JOB" || exit 0
          for i in 1 2 3 4 5; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep $((RANDOM % 20 + 5))
          done
          exit 1
