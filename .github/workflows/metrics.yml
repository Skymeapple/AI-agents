name: metrics
on:
  # GitHub only runs `schedule` from the default branch. While the lab lives on the
  # `research-lab` branch, metrics refresh on every lab push (the daily mission pushes
  # daily) and on manual dispatch. The cron applies once the lab is on a default branch.
  schedule:
    - cron: '17 5 * * *'
  push:
    branches: [research-lab]
    paths-ignore: ['lab/metrics/**', 'DASHBOARD.md']
  workflow_dispatch:
permissions:
  contents: write
concurrency: { group: metrics, cancel-in-progress: false }
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: research-lab }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Collect metrics
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Optional: a fine-grained PAT with "Administration: read" on this repo
          # unlocks traffic data (views, clones, per-project page views, referrers).
          LAB_STATS_TOKEN: ${{ secrets.LAB_STATS_TOKEN }}
        run: python3 scripts/collect_metrics.py
      - name: Build dashboard
        run: python3 scripts/build_dashboard.py
      - name: Commit
        run: |
          git config user.name "lab-metrics-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lab/metrics DASHBOARD.md README.md
          git diff --cached --quiet || git commit -m "metrics: $(date -u +%F)"
          git push origin HEAD:research-lab
