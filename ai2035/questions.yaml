# 面向2035的人工智能20个基础科学问题 —— 工作清单（重建版）
#
# 来源说明（重要）：原始文献为中国科学院学部“中国学科及前沿领域2035发展战略丛书”
# 中的人工智能卷（《中国人工智能基础研究2035发展战略》，科学出版社，2025）。
# 本环境无法访问原文及其转载页面，故下列 20 题并非原文逐字条目，而是依据可检索到的
# 主题片段（认知与计算的关系、机器学习统计学基础、稳健性与稳定性、小样本与缺标签学习、
# 数据共享与隐私保护、因果驱动方法、可解释性等）与国内同期权威议程（NSFC“可解释、可通用的
# 下一代人工智能方法”重大研究计划等）重建的工作清单。拿到原文后应逐条核对并替换 title 字段。
#
# arxiv: 用于文献计量的 arXiv 检索式（abs 字段短语，OR 连接）。
questions:
  - {id: Q01, group: 理论基础, slug: cognition-computation, title: 认知与计算的关系：智能的计算本质是什么,
     arxiv: ['associative memory', 'cognitive architecture', 'computational model of cognition', 'Hopfield network']}
  - {id: Q02, group: 理论基础, slug: deep-learning-math, title: 深度学习的数学机理：逼近、优化与隐式偏好,
     arxiv: ['spectral bias', 'implicit bias', 'neural tangent kernel', 'loss landscape']}
  - {id: Q03, group: 理论基础, slug: scaling-emergence, title: 大模型的规模律与能力涌现,
     arxiv: ['scaling law', 'scaling laws', 'emergent abilities', 'emergent ability']}
  - {id: Q04, group: 理论基础, slug: statistical-foundations, title: 机器学习的统计学基础：过参数化下的泛化,
     arxiv: ['double descent', 'benign overfitting', 'overparameterized', 'generalization bound']}
  - {id: Q05, group: 理论基础, slug: rl-theory, title: 强化学习的理论基础：探索与样本复杂度,
     arxiv: ['regret bound', 'sample complexity of reinforcement learning', 'exploration-exploitation', 'multi-armed bandit']}
  - {id: Q06, group: 学习范式, slug: few-label-learning, title: 小样本与缺标签学习,
     arxiv: ['few-shot learning', 'semi-supervised learning', 'label propagation', 'self-training']}
