# Measurements used by the cosmos simulations.
#
# Every entry carries where it came from, in the same spirit as the rest of this repo.
#   provenance: sourced  -> a named reference; `checked` says how far it was verified:
#       document        read in the primary document or data file itself
#       search-summary  seen in a web-search summary of the reference, not the paper
#       recalled        quoted from memory of the literature; NOT re-verified
#   provenance: assumed  -> a modelling choice, with a rationale
#
# Anything marked `recalled` should be checked against the paper before being relied on.

cmb:
  theta_star_prior:
    value: {mean: [0.01041, 0.02223, 0.14208],
            cov_1e9: [[0.006621, 0.12444, -1.1929], [0.12444, 21.344, -94.001], [-1.1929, -94.001, 1488.4]]}
    provenance: sourced
    checked: document
    ref: "DESI DR2 Results II, arXiv:2503.14738, Appendix A eqs. A1-A2: Gaussian prior on (theta*, omega_b, omega_bc)"
