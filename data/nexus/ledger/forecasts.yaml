# The forecast ledger: every dated, checkable prediction found in this repository.
#
# Extracted on 2026-11-28. Each entry names the file it came from and an anchor
# string that must still be present in that file (tests/test_nexus_ledger.py
# checks every one). Nothing here was resolved from memory: outcomes go in
# resolutions.yaml, and each must name its source.
#
# Not included, and why:
#   frontier-trends: $1B+ cyber incident attributed to AI-autonomous exploitation -- attribution of an incident to autonomous AI has no agreed arbiter
#   frontier-trends: Community-accepted useful quantum advantage -- no settling criterion: 'community-accepted' is a judgement
#   frontier-trends: Stratos sustained commercial operation -- 'sustained' is not defined
#   worldsim: ai_gap -- a constructed index with no external measurement
#   worldsim: pandemic_deaths (2030) -- the 2030 quantiles are all zero; the pandemic forecast is carried as a probability instead
#   worldsim: Cooperation and Fragmentation scenarios, and all 2050 quantiles -- conditional on lever settings nobody has chosen; 2030 current-trajectory values are the checkable part
#   airadar: data/radar/predictions.jsonl -- 7-day growth scores, not probabilities, and airadar already scores them itself (data/radar/reviews.jsonl)
#   ai100: numbered predictions P1..Pn in research/papers -- hypotheses about experiments with no date attached, except the two from p077 below
#   ai2035, cosmos, open-problems-sim, hfm-projects, world-understanding, autoscout -- no dated quantitative forecasts found
