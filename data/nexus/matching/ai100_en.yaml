# English matching terms for the AI-100 catalogue (research/questions.json).
#
# The catalogue is written in Chinese and sciscout's tokenizer keeps only Latin
# alphabetic tokens, so a Chinese question matches nothing in an English corpus.
# `en` is an English rendering of the question and `terms` are phrases a paper on
# it would plausibly use. BOTH WERE WRITTEN BY THE MODEL FOR MATCHING. They are not
# taken from the source, were not reviewed by a person, and are graded `assumed`.
# A bad gloss shows up as a problem wrongly reported neglected, so check the gloss
# before believing a neglected verdict.
